<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags in HTML</title>
</head>
<body>
    <a href="https://www.google.com/">Google</a>
    <a href="https://www.netflix.com/in/">Netflix</a>
    <a href="https://www.amazon.com/">Amazon</a>
    <a href="https://www.flipkart.com/">Flipkart</a>
    <a href="https://www.naukri.com/">Naukari</a>
<hr>

    <img src="Ironman.jpg" alt="Ironman Image" height="180px" width="180px">
    
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQrvdoBEMJnTMTFEeWMdF8OvUzhU06rbsFzX_9wT0sXnXKIxCSF15iv4H0_&s=10" alt="Joker Image" height="200px" width="200px">

     
<hr>
    <!-- This is poem in HTML -->
    <p>Twinkle Twinkle little star how i wonder what you are</p>
    <p> <b>Twinkle Twinkle</b> <br> <i>little star</i> <br>how i wonder <br> <u>what you are</u></p>

    <hr>
    <!-- HTML is not case sensitive -->
    <P>This is paragraph</P>
    <H3>This is heading</H3>
    
</body>
</html>

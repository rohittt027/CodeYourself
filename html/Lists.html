<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List in HTML</title>
  </head>
  <body>
    <ul type='square'>
      <h1>Fast Food</h1>
      <li>Bread</li>
      <li>Samosa</li>
      <li>Litti</li>
      <li>Biryani</li>
      <li>Bhatora</li>
      <li>Burger</li>
    </ul>

    <ol type="a">
      <h2>Fruits</h2>
      <li>Apple</li>
      <li>Banana</li>
      <li>Orange</li>
      <li>Grapes</li>
      <li>Pineapple</li>
      <li>Gua</li>
    </ol>
  </body>
</html>
